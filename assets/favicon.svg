  <path d="M 45.40 21.53 A 17.0 17.0 0 1 0 45.40 42.47" fill="none" stroke="#FBFAF7" stroke-width="13" stroke-linecap="round"/>
  <path d="M 24.7 32.8 L 29.3 37.8 L 38.8 24.9" fill="none" stroke="#9C7B4D" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
