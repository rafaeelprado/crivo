name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyTorch de CPU primeiro, para o pip não baixar a versão com CUDA (vários GB)
      - name: Instalar PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar o projeto
        run: pip install -e ".[dev]"

      # Nenhum teste chama a API de verdade (o README garante isso), então a chave é falsa
      - name: Testes
        env:
          ANTHROPIC_API_KEY: chave-falsa-para-ci
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # não bloqueia até você limpar os avisos do ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests
